[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-infertriage"
version = "0.1.0a1"
description = "Evidence-based, cross-layer performance triage for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.10,<3", "typer>=0.15,<1", "rich>=13,<15",
  "jinja2>=3.1,<4", "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
]

[project.scripts]
agent-infertriage = "agent_infertriage.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "opentelemetry-sdk>=1.30,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_infertriage"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: explicitly enabled model endpoint", "gpu: requires GPU infrastructure"]
