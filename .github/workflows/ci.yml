name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked
      - run: uv run ruff check src tests examples scripts
      - run: uv run ruff format --check src tests examples scripts
      - run: uv run mypy src
      - run: uv run pytest -q -m "not live and not gpu"
      - run: uv run agent-infertriage demo --output-dir results/demo
      - run: uv run agent-infertriage demo-agent --output-dir results/mock-agent
      - run: uv run agent-infertriage analyze examples/with-prometheus --output-dir results/prometheus
