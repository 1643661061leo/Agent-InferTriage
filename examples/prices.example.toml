# Fictional rates for exercising accounting, NOT any provider's real prices.
# Prices are per million inclusive input/output tokens. Set effective_at for auditability.
[[prices]]
provider = "local-compatible"
model = "replace-with-your-served-model-name"
currency = "DEMO"
effective_at = "2026-10-23"
scheme = "flat"
input_per_million = "1.0"
output_per_million = "2.0"

# For disjoint normal/cache-read/cache-write buckets use scheme = "split_cache" plus
# cache_read_per_million/cache_write_per_million. Counts must be known and disjoint.
