# Copy to model.toml and set YOUR endpoint/model. No discovery or default paid endpoint.
# endpoint is the API base ending in /v1, not the full /chat/completions path.
endpoint = "http://127.0.0.1:8000/v1"
model = "replace-with-your-served-model-name"
provider = "local-compatible"
# api_key_env = "INFERTRIAGE_ANALYSIS_KEY"
max_rounds = 6
max_attempts = 8
max_tool_calls = 24
max_output_tokens = 1024
max_input_tokens = 12000
max_total_tokens = 40000
max_seconds = 300
request_timeout = 45
